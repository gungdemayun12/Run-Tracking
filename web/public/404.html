<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Halaman tidak ditemukan • RunTrack</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #e9eef5;
    text-align: center;
    background:
      radial-gradient(560px 380px at 22% 12%, rgba(255,107,53,.2), transparent 62%),
      linear-gradient(160deg, #0a0f16 0%, #101923 55%, #0a0f16 100%);
  }
  .card {
    width: 100%;
    max-width: 400px;
    padding: 30px 26px;
    border-radius: 24px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 30px 70px rgba(0,0,0,.45);
  }
  .code { font-size: 44px; font-weight: 800; letter-spacing: -.04em; color: #ff6b35; }
  h1 { margin: 6px 0 0; font-size: 20px; letter-spacing: -.02em; }
  p { margin: 10px 0 0; font-size: 13px; line-height: 1.6; color: #9fb0c2; }
  a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 22px;
    height: 48px;
    padding: 0 22px;
    border-radius: 24px;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    background: linear-gradient(135deg, #ff8a4c, #e8470e);
  }
</style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Halaman tidak ditemukan</h1>
    <p>Tautan yang kamu buka tidak tersedia. Kembali ke halaman reset password untuk melanjutkan.</p>
    <a href="/reset-password/">Halaman reset password</a>
  </main>
</body>
</html>
