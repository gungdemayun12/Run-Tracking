<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>RunTrack</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #e9eef5;
    text-align: center;
    background:
      radial-gradient(620px 420px at 20% 10%, rgba(255,107,53,.22), transparent 62%),
      radial-gradient(540px 420px at 85% 88%, rgba(255,107,53,.16), transparent 65%),
      linear-gradient(160deg, #0a0f16 0%, #101923 52%, #0a0f16 100%);
  }
  .card {
    width: 100%;
    max-width: 420px;
    padding: 32px 28px;
    border-radius: 26px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 30px 70px rgba(0,0,0,.45);
    backdrop-filter: blur(14px);
  }
  .mark {
    width: 58px;
    height: 58px;
    margin: 0 auto 18px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #ff8a4c, #e8470e);
    box-shadow: 0 14px 28px rgba(232,71,14,.4);
    font-size: 26px;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
  p { margin: 10px 0 0; font-size: 13px; line-height: 1.6; color: #9fb0c2; }
  a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 22px;
    height: 50px;
    padding: 0 24px;
    border-radius: 25px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    background: linear-gradient(135deg, #ff8a4c, #e8470e);
    box-shadow: 0 14px 26px rgba(232,71,14,.34);
  }
  .foot { margin-top: 18px; font-size: 10px; letter-spacing: .14em; color: #6d7f92; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">🏃</div>
    <h1>RunTrack</h1>
    <p>Halaman ini dipakai untuk proses pemulihan akun RunTrack. Buka tautan reset dari email kamu untuk membuat kata sandi baru.</p>
    <a href="./reset-password/">Buka halaman reset password</a>
    <div class="foot">RUN • TRACK • IMPROVE</div>
  </main>
</body>
</html>
